[package]
name = "pier"
version = "0.2.0"
description = "Desktop companion for a development VM: images into Pi, over SSH"
edition = "2021"
rust-version = "1.89"

[lib]
name = "pier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
# ring instead of the default aws-lc: same algorithms, but it builds with the plain
# compiler toolchain (aws-lc wants CMake and NASM on Windows).
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6"
png = "0.18"
anyhow = "1"
russh-sftp = "3"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tar = "0.4"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
