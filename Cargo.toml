[package]
name = "pier"
version = "0.1.0"
edition = "2024"

[dependencies]
# wgpu by default, glow (OpenGL) as fallback or with PIER_RENDERER=glow: glow froze a PC on resize (see main.rs).
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wgpu_no_default_features"] }
# DirectX 12 only: each extra backend loads its driver at start (OpenGL ES added 15 MB). Without DX12, glow takes over.
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
png = "0.18" # already built by eframe; encodes pasted images
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Job Objects: a tab's whole process tree (launcher, Pi, what bash started) dies with the tab or with Pier.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
