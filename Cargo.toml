[package]
name = "pier"
version = "0.1.0"
edition = "2024"

[dependencies]
# glow (OpenGL) instead of the default wgpu: measured 100 MB vs 220 MB RAM idle on this machine (wgpu loads Vulkan+DX12 on both GPUs).
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Job Objects: a tab's whole process tree (launcher, Pi, what bash started) dies with the tab or with Pier.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }
